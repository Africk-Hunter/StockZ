<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>StockZ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Michroma&family=Barlow:wght@400;500;600&family=Azeret+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/output.css">
    <meta property="og:title" content="StockZ">
    <meta property="og:description" content="Know the price to buy at, before you buy.">
    <meta property="og:image" content="https://stock-z.com/src/og-image.png">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="icon" type="image/svg+xml" href="/src/favicon.svg">
    <link rel="icon" type="image/x-icon" href="/src/favicon.ico">
    <link rel="apple-touch-icon" href="/src/apple-touch-icon.png">
</head>
<body class="bg-deep text-cream w-full min-h-screen">

<div class="flex flex-col items-center font-body min-h-screen" id="mainWrapper">

    <nav class="hidden laptop:grid grid-cols-3 w-full h-16 px-6 border-solid border-b border-hairline" aria-label="Primary">
        <div id="stockZLogo" class="nav-home flex justify-self-start self-center">
            <button type="button" class="caps caps-wide flex gap-3 text-wordmark tracking-caps-label text-cream select-none" aria-label="StockZ home">STOCK<span class="text-lime">Z</span></button>
        </div>

        <div class="flex justify-self-center justify-between items-center h-full w-full self-center">
            <div id="tickerInfoBtn" class="nav-ticker-info"><button type="button" class="navlink">Ticker Info</button></div>
            <div id="homeBtn" class="nav-home"><button type="button" class="navlink is-on" aria-current="page">Main</button></div>
            <div id="watchListBtn" class="nav-watchlist"><button type="button" class="navlink">Watch List</button></div>
        </div>

        <div class="flex justify-self-end items-center gap-2 h-full">
            <button type="button" class="nav-bug-report chip chip-icon" title="Report a problem" aria-label="Report a problem"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="butt" stroke-linejoin="miter" class="icon" aria-hidden="true"><path d="M12 2l10 10-10 10L2 12zM12 8v5M12 16v1"/></svg></button>
            <button type="button" class="nav-logout chip chip-icon" id="logOutButton" title="Log out" aria-label="Log out"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="butt" stroke-linejoin="miter" class="icon" aria-hidden="true"><path d="M10 4H4v16h6M14 8l4 4-4 4M18 12H9"/></svg></button>
        </div>
    </nav>

    <div class="laptop:hidden flex items-center justify-between w-full px-6 pt-4 pb-2">
        <div class="nav-home">
            <button type="button" class="caps caps-wide flex gap-2 text-h3 tracking-caps-label text-cream select-none" aria-label="StockZ home">STOCK<span class="text-lime">Z</span></button>
        </div>
        <div class="flex items-center gap-2">
            <button type="button" class="nav-bug-report chip chip-icon" title="Report a problem" aria-label="Report a problem"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="butt" stroke-linejoin="miter" class="icon" aria-hidden="true"><path d="M12 2l10 10-10 10L2 12zM12 8v5M12 16v1"/></svg></button>
            <button type="button" class="nav-logout chip chip-icon" title="Log out" aria-label="Log out"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="butt" stroke-linejoin="miter" class="icon" aria-hidden="true"><path d="M10 4H4v16h6M14 8l4 4-4 4M18 12H9"/></svg></button>
        </div>
    </div>

    <nav class="laptop:hidden fixed bottom-0 left-0 right-0 flex bg-deep border-solid border-t border-hairline z-10" aria-label="Primary">
        <button type="button" class="nav-ticker-info tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="butt" stroke-linejoin="miter" class="icon" aria-hidden="true"><path d="M4 20h16M7 16v-6M12 16V5M17 16v-4"/></svg><span>Ticker Info</span></button>
        <button type="button" class="nav-home tab is-on" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="butt" stroke-linejoin="miter" class="icon" aria-hidden="true"><path d="M4 4h10v10H4zM14 14l6 6"/></svg><span>Search</span></button>
        <button type="button" class="nav-watchlist tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="butt" stroke-linejoin="miter" class="icon" aria-hidden="true"><path d="M3 5h6l2 3h10v11H3z"/></svg><span>Watch List</span></button>
    </nav>

    <main class="flex flex-col h-max laptop:h-full w-full justify-start items-center fade-in py-8 pb-24 laptop:pb-8">
        <div id="tickerParentBox" class="edged flex justify-center items-center aspect-[8/3] laptop:aspect-[13/4] w-5/6 laptop:w-2/6 select-none mt-24 cursor-pointer">
            <input type="text" id="mainTickerInput" placeholder="TICKER" aria-label="Ticker symbol" autocomplete="off" class="bg-transparent text-center uppercase text-cream outline-none text-5xl laptop:text-display placeholder:text-5xl laptop:placeholder:text-display focus:placeholder-transparent h-full w-full overflow-hidden">
        </div>
        <p id="tickerError" role="alert" class="field-error-text hidden mt-4 text-center">Invalid ticker. Check the symbol and try again.</p>
        <button id="tickerSubmitBtn" class="btn hidden mt-10 w-2/3 laptop:w-60 h-14">Continue</button>

        <div class="laptop:hidden flex flex-col gap-2 w-5/6 mt-8">
            <div id="mobileSearchResultsLabel" class="section-label">Your Watchlist</div>
            <div id="mobileSearchResultsContainer" class="flex flex-col gap-2">
            </div>
        </div>
    </main>

</div>

<script type="module" src="/src/javascript.mjs"></script>
</body>
</html>
