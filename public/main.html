<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockZ</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/output.css">
    <link rel="stylesheet" href="/src/style.css">
    <link rel="icon" type="image/x-icon" href="/src/favicon.ico">
</head>
<body class="bg-background w-screen h-screen">

<div class="flex flex-col items-center font-poppins h-screen" id="mainWrapper">

    <nav class="hidden laptop:grid grid-rows-1 grid-cols-3 sized90 h-12 laptop:h-16 border-solid border-b border-text-color border-opacity-25">
        <div id="stockZLogo" class="nav-home flex justify-self-start bg-transparent font-semibold justify-center laptop:gap-1 self-center hover:cursor-pointer">
            <span class="text-text-color hidden laptop:flex laptop:text-5xl select-none">STOCK</span><span class="text-accent-color select-none text-4xl laptop:text-5xl ml-2">Z</span>
        </div>

        <div class="flex justify-self-center justify-between items-center h-full w-5/6 desktop:w-5/6 laptop:w-full laptop:text-xl desktop:text-2xl self-center text-text-color font-medium">
            <div id="tickerInfoBtn" class="nav-ticker-info"><img src="/src/tickerIcon.png" alt="Watch List" class="laptop:hidden h-6"><button class="hidden laptop:flex">Ticker Info</button></div>
            <div id="homeBtn" class="nav-home"><img src="/src/houseIcon.svg" alt="Watch List" class="laptop:hidden h-6"><button class="hidden laptop:flex underline underline-offset-8">Main</button></div>
            <div id="watchListBtn" class="nav-watchlist"><img src="/src/listIcon.png" alt="Watch List" class="laptop:hidden h-6"><button class="hidden laptop:flex">Watch List</button></div>
        </div>

        <div class="flex justify-self-end items-center gap-4 h-full mr-5">
            <button type="button" class="nav-bug-report flex items-center text-text-color hover:text-accent-color transition-colors duration-150" title="Report a problem" aria-label="Report a problem">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-5 h-5 laptop:w-6 laptop:h-6"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v4m0 4h.01M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"/></svg>
            </button>
            <button class="nav-logout flex items-center" id="logOutButton">
                <img src="/src/logOut.png" alt="Log Out" class="h-6 laptop:h-8">
            </button>
        </div>
    </nav>

    <div class="laptop:hidden flex items-center justify-between w-full px-5 pt-4 pb-1">
        <div class="nav-home flex items-baseline gap-1 font-poppins font-extrabold text-sm tracking-widest uppercase select-none hover:cursor-pointer">
            <span class="text-text-color">Stock</span><span class="text-accent-color">Z</span>
        </div>
        <div class="flex items-center gap-3">
            <button type="button" class="nav-bug-report flex items-center justify-center w-8 h-8 text-text-color hover:text-accent-color transition-colors duration-150" title="Report a problem" aria-label="Report a problem">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-5 h-5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v4m0 4h.01M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"/></svg>
            </button>
            <button type="button" class="nav-logout flex items-center justify-center w-8 h-8">
                <img src="/src/logOut.png" alt="Log Out" class="h-4">
            </button>
        </div>
    </div>

    <nav class="laptop:hidden fixed bottom-0 left-0 right-0 flex bg-background border-t border-text-color border-opacity-25 pb-6 pt-2 z-10">
        <div class="nav-ticker-info flex-1 flex flex-col items-center gap-1 hover:cursor-pointer">
            <img src="/src/tickerIcon.png" alt="" class="h-4 opacity-50">
            <span class="text-text-color text-opacity-60 text-[11px] font-semibold">Ticker Info</span>
        </div>
        <div class="nav-home flex-1 flex flex-col items-center gap-1 hover:cursor-pointer">
            <img src="/src/houseIcon.svg" alt="" class="h-4">
            <span class="text-accent-color text-[11px] font-semibold">Search</span>
        </div>
        <div class="nav-watchlist flex-1 flex flex-col items-center gap-1 hover:cursor-pointer">
            <img src="/src/listIcon.png" alt="" class="h-4 opacity-50">
            <span class="text-text-color text-opacity-60 text-[11px] font-semibold">Watch List</span>
        </div>
    </nav>

    <main class="flex flex-col h-max laptop:h-full w-full justify-start items-center font-bold fade-in py-8 pb-24 laptop:pb-8">
        <div id="tickerParentBox" class="flex justify-center items-center border-text-color border-2 laptop:border-3 border-opacity-50 border-solid rounded-lg h-1/4 laptop:h-1/3 w-5/6 laptop:w-2/6 select-none mt-24 hover:cursor-pointer transition-all duration-500 ease-in-out">
            <input type="text" id="mainTickerInput" placeholder="TICKER" autocomplete="off" class="bg-transparent text-center uppercase placeholder:text-center text-text-color placeholder-text-text-color placeholder-opacity-60 outline-none text-5xl laptop:text-8xl desktop:text-8xl desktopXL:text-9xl placeholder:text-5xl laptop:placeholder:text-8xl desktop:placeholder:text-8xl desktopXL:placeholder:text-9xl  h-full w-full focus:placeholder-transparent overflow-hidden">
        </div>
        <button id="tickerSubmitBtn" class="hidden justify-center items-center bg-secondary-color mt-10 w-1/2 laptop:w-60 h-14 laptop:h-14 rounded hover:bg-text-color hover:text-background hover:-translate-y-2 transition-all duration-150 ease-in-out text-text-color text-2xl laptop:text-3xl">Continue</button>

        <div class="laptop:hidden flex flex-col gap-2 w-5/6 mt-8">
            <div id="mobileSearchResultsLabel" class="text-text-color text-opacity-60 font-bold text-xs uppercase tracking-wide">Your Watchlist</div>
            <div id="mobileSearchResultsContainer" class="flex flex-col gap-2">
            </div>
        </div>
    </main>

</div>

<script type="module" src="/src/javascript.mjs"></script>
</body>
</html>
