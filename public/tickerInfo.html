<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>StockZ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Michroma&family=Barlow:wght@400;500;600&family=Azeret+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/output.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js" integrity="sha384-NrKB+u6Ts6AtkIhwPixiKTzgSKNblyhlk0Sohlgar9UHUBzai/sgnNNWWd291xqt" crossorigin="anonymous"></script>
    <link rel="icon" type="image/x-icon" href="/src/favicon.ico">
</head>
<body class="bg-deep text-cream w-full min-h-screen">

<div class="flex flex-col items-center font-body min-h-screen overflow-x-clip" id="mainWrapper">

    <nav class="hidden laptop:grid grid-cols-3 w-full h-16 px-6 border-solid border-b border-hairline" aria-label="Primary">
        <div id="stockZLogo" class="nav-home flex justify-self-start self-center">
            <button type="button" class="caps caps-wide flex gap-3 text-wordmark tracking-caps-label text-cream select-none" aria-label="StockZ home">STOCK<span class="text-lime">Z</span></button>
        </div>

        <div class="flex justify-self-center justify-between items-center h-full w-full self-center">
            <div id="tickerInfoBtn" class="nav-ticker-info"><button type="button" class="navlink is-on" aria-current="page">Ticker Info</button></div>
            <div id="homeBtn" class="nav-home"><button type="button" class="navlink">Main</button></div>
            <div id="watchListBtn" class="nav-watchlist"><button type="button" class="navlink">Watch List</button></div>
        </div>

        <div class="flex justify-self-end items-center gap-2 h-full">
            <button type="button" class="nav-bug-report chip chip-icon h-11 w-11 laptop:h-9 laptop:w-9" title="Report a problem" aria-label="Report a problem"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="butt" stroke-linejoin="miter" class="icon" aria-hidden="true"><path d="M12 2l10 10-10 10L2 12zM12 8v5M12 16v1"/></svg></button>
            <button type="button" class="nav-logout chip chip-icon" id="logOutButton" title="Log out" aria-label="Log out"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="butt" stroke-linejoin="miter" class="icon" aria-hidden="true"><path d="M10 4H4v16h6M14 8l4 4-4 4M18 12H9"/></svg></button>
        </div>
    </nav>

    <div class="laptop:hidden flex items-center justify-between w-full px-6 pt-4 pb-2">
        <div class="nav-home">
            <button type="button" class="caps caps-wide flex gap-2 text-h3 tracking-caps-label text-cream select-none" aria-label="StockZ home">STOCK<span class="text-lime">Z</span></button>
        </div>
        <div class="flex items-center gap-2">
            <button type="button" class="nav-bug-report chip chip-icon h-11 w-11 laptop:h-9 laptop:w-9" title="Report a problem" aria-label="Report a problem"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="butt" stroke-linejoin="miter" class="icon" aria-hidden="true"><path d="M12 2l10 10-10 10L2 12zM12 8v5M12 16v1"/></svg></button>
            <button type="button" class="nav-logout chip chip-icon h-11 w-11 laptop:h-9 laptop:w-9" title="Log out" aria-label="Log out"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="butt" stroke-linejoin="miter" class="icon" aria-hidden="true"><path d="M10 4H4v16h6M14 8l4 4-4 4M18 12H9"/></svg></button>
        </div>
    </div>

    <nav class="laptop:hidden fixed bottom-0 left-0 right-0 flex bg-deep border-solid border-t border-hairline z-10" aria-label="Primary">
        <button type="button" class="nav-ticker-info tab is-on" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="butt" stroke-linejoin="miter" class="icon" aria-hidden="true"><path d="M4 20h16M7 16v-6M12 16V5M17 16v-4"/></svg><span>Ticker Info</span></button>
        <button type="button" class="nav-home tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="butt" stroke-linejoin="miter" class="icon" aria-hidden="true"><path d="M4 4h10v10H4zM14 14l6 6"/></svg><span>Search</span></button>
        <button type="button" class="nav-watchlist tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="butt" stroke-linejoin="miter" class="icon" aria-hidden="true"><path d="M3 5h6l2 3h10v11H3z"/></svg><span>Watch List</span></button>
    </nav>

    <main class="flex flex-col h-max laptop:h-full w-full laptop:w-11/12 max-w-[1500px] justify-start laptop:justify-between items-center gap-2 fade-in-rest py-6 pb-48 laptop:py-8 laptop:pb-8 px-4 laptop:px-0">
        <div id="tickerLabelIP" class="edged flex justify-center items-center select-none h-16 w-3/6 laptop:w-52 cursor-pointer text-center uppercase caps caps-wide caps-display text-cream text-h2 laptop:text-wordmark overflow-hidden"></div>

        <div class="laptop:hidden flex items-stretch w-full gap-grout bg-deep cut-md">
            <div class="flex flex-col justify-center gap-1 flex-1 min-w-0 bg-canopy px-4 py-3">
                <div class="caps text-label tracking-caps-label text-sand">Current price</div>
                <div id="mobileCurrentPrice" class="font-mono font-semibold tabular-nums text-h2 leading-none text-cream">N/A</div>
            </div>
            <div id="mobileVerdict" class="caps flex items-center justify-center w-28 bg-canopy px-2 text-body font-semibold tracking-caps-label text-cream text-center">&mdash;</div>
        </div>

        <div id="thresHoldWarning" data-state="Warning" class="status is-warning hidden w-full laptop:w-full"><span>Threshold was lowered. Use caution when examining stock.</span></div>
        <label id="skipRecentRow" class="flex items-center justify-end gap-2 w-full caps text-label tracking-caps-label text-sand">
            <span>Look past the last</span>
            <select id="skipRecentMonths" aria-label="Ignore the most recent months when finding the dip" class="caps cut-sm bg-canopy text-cream text-body tracking-caps-label pl-3 pr-2 py-1 outline-none">
                <option value="0">0 months (default)</option>
                <option value="3">3 months</option>
                <option value="6">6 months</option>
                <option value="12">12 months</option>
                <option value="24">24 months</option>
            </select>
        </label>
        <div id="buyHolder" class="hidden laptop:grid grid-cols-8 grid-rows-[auto_4rem] desktopXL:grid-rows-[auto_6rem] gap-grout bg-deep cut-md w-full laptop:w-full">
                <div class="label-tile col-span-2 laptop:text-small desktopXL:text-value">Great Buy Range</div>
                <div class="label-tile col-span-2 laptop:text-small desktopXL:text-value">Good Buy Range</div>
                <div class="label-tile col-span-2 laptop:text-small desktopXL:text-value">Okay Buy Range</div>
                <div class="label-tile col-span-2 laptop:text-small desktopXL:text-value">Bad Buy Range</div>
                <div id="grBL" class="value-tile bg-band-great-1 text-ink text-small laptop:text-[22px] desktopXL:text-[28px]"></div>
                <div id="grBH" class="value-tile bg-band-great-2 text-ink text-small laptop:text-[22px] desktopXL:text-[28px]"></div>
                <div id="gBL" class="value-tile bg-band-good-1 text-ink text-small laptop:text-[22px] desktopXL:text-[28px]"></div>
                <div id="gBH" class="value-tile bg-band-good-2 text-ink text-small laptop:text-[22px] desktopXL:text-[28px]"></div>
                <div id="oBL" class="value-tile bg-band-okay-1 text-ink text-small laptop:text-[22px] desktopXL:text-[28px]"></div>
                <div id="oBH" class="value-tile bg-band-okay-2 text-ink text-small laptop:text-[22px] desktopXL:text-[28px]"></div>
                <div id="bBL" class="value-tile bg-band-bad-1 text-cream text-small laptop:text-[22px] desktopXL:text-[28px]"></div>
                <div id="bBH" class="value-tile bg-band-bad-2 text-cream text-small laptop:text-[22px] desktopXL:text-[28px]"></div>
        </div>
        <div class="laptop:hidden flex flex-col gap-2 w-full">
            <div class="section-label text-small">Buy range</div>
            <div class="flex flex-col gap-grout bg-deep cut-md">
                <div class="grid grid-cols-[5rem_1fr] items-center bg-band-great-1 text-ink animate-arrive" style="animation-delay:0ms">
                    <div class="caps px-3 py-4 text-small font-semibold tracking-caps-label">Great</div>
                    <div id="mobileGreatRange" class="px-3 py-4 text-right font-mono font-semibold tabular-nums text-body"></div>
                </div>
                <div class="grid grid-cols-[5rem_1fr] items-center bg-band-good-1 text-ink animate-arrive" style="animation-delay:75ms">
                    <div class="caps px-3 py-4 text-small font-semibold tracking-caps-label">Good</div>
                    <div id="mobileGoodRange" class="px-3 py-4 text-right font-mono font-semibold tabular-nums text-body"></div>
                </div>
                <div class="grid grid-cols-[5rem_1fr] items-center bg-band-okay-1 text-ink animate-arrive" style="animation-delay:150ms">
                    <div class="caps px-3 py-4 text-small font-semibold tracking-caps-label">Okay</div>
                    <div id="mobileOkayRange" class="px-3 py-4 text-right font-mono font-semibold tabular-nums text-body"></div>
                </div>
                <div class="grid grid-cols-[5rem_1fr] items-center bg-band-bad-1 text-cream animate-arrive" style="animation-delay:225ms">
                    <div class="caps px-3 py-4 text-small font-semibold tracking-caps-label">Bad</div>
                    <div id="mobileBadRange" class="px-3 py-4 text-right font-mono font-semibold tabular-nums text-body"></div>
                </div>
            </div>
        </div>
        <section id="extraInfo" class="flex flex-col laptop:flex-row laptop:gap-6 w-full laptop:w-full laptop:items-stretch items-center">
            <div class="w-full laptop:w-3/4">
                <div class="flex flex-col items-stretch laptop:flex-row laptop:items-center justify-between gap-2 mb-2">
                    <div id="chartDelta" class="hidden"></div>
                    <div id="chartRangeButtons" class="grid grid-cols-4 gap-2 laptop:flex laptop:justify-end laptop:ml-auto"></div>
                </div>
                <div class="innerChart">
                    <canvas id="stockChart" class="flex"></canvas>
                </div>
            </div>
            <div class="flex flex-col gap-grout w-full laptop:w-1/4 h-full bg-deep cut-md">
                <div class="grid grid-cols-[3fr_2fr] gap-grout min-h-24 laptop:h-1/4">
                    <div id="currentPriceTile" class="flex flex-col justify-center gap-1 px-4 py-3 bg-canopy text-cream min-w-0 transition-colors duration-hover">
                        <span class="tile-caption caps whitespace-nowrap text-label tracking-caps-label text-sand">Current price</span>
                        <div id="currentPrice" class="font-mono font-semibold tabular-nums leading-none text-h3 desktopXL:text-h2"></div>
                    </div>
                    <div class="flex flex-col justify-center gap-1 px-4 py-3 bg-canopy text-cream min-w-0">
                        <span class="caps whitespace-nowrap text-label tracking-caps-label text-sand">Dip price</span>
                        <div id="dipPrice" class="font-mono font-semibold tabular-nums leading-none text-value desktopXL:text-h3"></div>
                    </div>
                </div>
                <div class="flex flex-col laptop:flex-1 gap-grout">
                    <div class="info-row"><span class="info-label">Dividend Yield</span><span id="dividendYield" class="info-value"></span></div>
                    <div class="info-row"><span class="info-label">Payout Ratio</span><span id="payoutRatio" class="info-value"></span></div>
                    <div class="info-row"><span class="info-label">Last Payout</span><span id="lastPayoutAmount" class="info-value"></span></div>
                    <div class="info-row"><span class="info-label">Market Cap</span><span id="marketCapValue" class="info-value"></span></div>
                    <div class="info-row"><span class="info-label">Cap Size</span><span id="capCategory" class="info-value"></span></div>
                    <div class="info-row"><span class="info-label">Sector</span><span id="sectorValue" class="info-value"></span></div>
                </div>
            </div>
        </section>

        <section id="otherButtons" class="flex flex-col min-h-1/6 laptop:h-44 desktopXL:h-52 w-full laptop:w-1/4 desktopXL:w-2/5 gap-2 justify-end">
            <button id="addToWatchlist" class="btn above-tab fixed left-4 w-[calc(100%-2rem)] z-10 h-14 text-small laptop:static laptop:w-auto laptop:z-auto laptop:h-2/6 laptop:text-small desktop:text-body">Add To Watchlist</button>
            <div class="section-label text-small laptop:hidden mt-2">More on this stock</div>
            <div class="flex justify-between w-full h-12 laptop:h-2/6 gap-2">
                <button id="stockStatsLink" class="chip w-1/2 h-full text-small desktop:text-body">Statistics <svg class="inline-block h-3 w-3 flex-shrink-0" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="square" aria-hidden="true"><path d="M5 2H2v8h8V7M7 2h3v3M10 2L5.5 6.5"/></svg></button>
                <button id="stockDescLink" class="chip w-1/2 h-full text-small desktop:text-body">Description <svg class="inline-block h-3 w-3 flex-shrink-0" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="square" aria-hidden="true"><path d="M5 2H2v8h8V7M7 2h3v3M10 2L5.5 6.5"/></svg></button>
            </div>
            <div class="flex justify-between w-full h-12 laptop:h-2/6 gap-2">
                <button id="dividendHistoryLink" class="chip w-1/2 h-full text-small desktop:text-body">Dividends <svg class="inline-block h-3 w-3 flex-shrink-0" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="square" aria-hidden="true"><path d="M5 2H2v8h8V7M7 2h3v3M10 2L5.5 6.5"/></svg></button>
                <button id="epsChartLink" class="chip w-1/2 h-full text-small desktop:text-body">EPS Chart <svg class="inline-block h-3 w-3 flex-shrink-0" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="square" aria-hidden="true"><path d="M5 2H2v8h8V7M7 2h3v3M10 2L5.5 6.5"/></svg></button>
            </div>
        </section>
    </main>

</div>

<div id="folderModalOverlay" class="hidden modal-overlay">
    <div id="folderModal" class="modal-panel">
        <div class="flex justify-between items-center">
            <h2 id="folderModalTitle" class="modal-title">Add to a Watchlist</h2>
            <button id="folderModalCloseBtn" type="button" class="chip chip-icon flex-shrink-0 text-body" aria-label="Close">&times;</button>
        </div>
        <div id="folderModalList" class="flex flex-col gap-grout max-h-60 desktop:max-h-80 overflow-y-auto no-scrollbar">
        </div>
        <form id="folderModalNewFolderForm" class="flex gap-2 mt-2">
            <input id="folderModalNewFolderInput" type="text" placeholder="New watchlist name" maxlength="40" autocomplete="off" aria-label="New watchlist name" class="field flex-1 min-w-0">
            <button type="submit" class="chip flex-shrink-0">Create</button>
        </form>
        <button id="folderModalAddBtn" type="button" class="btn">Add</button>
    </div>
</div>

<script type="module" src="/src/javascript.mjs"></script>
</body>
</html>
