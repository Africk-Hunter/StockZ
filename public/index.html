<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>StockZ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Michroma&family=Barlow:wght@400;500;600&family=Azeret+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/output.css">
    <meta property="og:title" content="StockZ">
    <meta property="og:description" content="Know the price to buy at, before you buy.">
    <meta property="og:image" content="https://stock-z.com/src/og-image.png">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="icon" type="image/svg+xml" href="/src/favicon.svg">
    <link rel="icon" type="image/x-icon" href="/src/favicon.ico">
    <link rel="apple-touch-icon" href="/src/apple-touch-icon.png">
</head>
<body class="overflow-hidden bg-deep text-cream w-screen h-screen">

<div class="flex flex-col justify-center items-center font-body bg-deep h-screen fade-in px-4">

    <div id="stockZ" class="caps caps-wide flex justify-center text-h2 laptop:text-display tracking-caps-display gap-3 laptop:gap-6 mb-12 select-none">
        <span class="text-cream">STOCK</span> <span class="text-lime">Z</span>
    </div>
    <div class="flex flex-col laptop:flex-row gap-2 laptop:gap-6">
        <input type="text" name="username" id="inputUsername" class="field w-64 laptop:w-56" placeholder="Username" aria-label="Username" autocomplete="username">
        <input type="password" name="password" id="inputPassword" class="field w-64 laptop:w-56" placeholder="Password" aria-label="Password" autocomplete="current-password">
    </div>
    <p id="loginError" role="alert" class="field-error-text hidden mt-4 text-center"></p>
    <button type="button" id="enterButton" class="btn w-64 laptop:w-40 h-12 mt-6 laptop:mt-12">Enter</button>
</div>

<script type="module" src="/src/javascript.mjs">
</script>

</body>
</html>
