[build]
  publish = "public"
  functions = "netlify/functions"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"

[dev]
  framework = "#static"
  publish = "public"
  functions = "netlify/functions"

[[redirects]]
  from = "/main"
  to = "/main.html"
  status = 200

[[redirects]]
  from = "/tickerInfo"
  to = "/tickerInfo.html"
  status = 200

[[redirects]]
  from = "/watchlist"
  to = "/watchlist.html"
  status = 200

[[redirects]]
  from = "/stock-info"
  to = "/.netlify/functions/stock-info"
  status = 200

[[redirects]]
  from = "/run-calculations"
  to = "/.netlify/functions/run-calculations"
  status = 200

[[redirects]]
  from = "/run-dividend-info"
  to = "/.netlify/functions/run-dividend-info"
  status = 200

[[redirects]]
  from = "/log-error"
  to = "/.netlify/functions/log-error"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(), microphone=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://www.gstatic.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://www.gstatic.com https://www.googleapis.com https://securetoken.googleapis.com https://identitytoolkit.googleapis.com https://firestore.googleapis.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
